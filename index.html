<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a120d">
<title>FM26 Mobile Coach</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0a120d;--card:#101b13;--line:#1e3325;--acc:#7CFC00;--acc2:#ffd23f;--txt:#e8f5e9;--mut:#8fae94;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:76px;font-size:14px;line-height:1.5}
header{position:sticky;top:0;z-index:10;background:#0a120d;border-bottom:1px solid var(--line);padding:12px 14px}
header h1{font-size:17px}header h1 span{color:var(--acc)}
header p{font-size:11px;color:var(--mut)}
#app{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:8px}.card h3{font-size:13px;margin:10px 0 6px;color:var(--acc2)}
.card p{margin-bottom:8px}.card ul{margin:6px 0 6px 18px}.card li{margin-bottom:5px}
.mut{color:var(--mut);font-size:12px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin:2px 4px 2px 0}
.t-Marquee{background:#ffd23f;color:#111}.t-Mid{background:#4da3ff;color:#06121f}.t-Budget{background:#7CFC00;color:#0a120d}
.t-pos{background:#1e3325;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{flex:1;min-width:60px;text-align:center;background:#16241a;border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:13px;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--acc);color:#0a120d;font-weight:700;border-color:var(--acc)}
.chip small{display:block;font-size:10px;color:inherit;opacity:.7}
button.fbtn{background:var(--acc);color:#0a120d;border:none;border-radius:10px;padding:12px;width:100%;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
input[type=text]{width:100%;background:#16241a;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:14px;margin:6px 0}
.result{background:#0d1a10;border:1px solid var(--acc);border-radius:12px;padding:14px;margin:10px 0}
.result h3{color:var(--acc);margin-bottom:6px}
.big{font-size:20px;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a120d;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--mut);font-size:10px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px}nav button.on{color:var(--acc);font-weight:700}
.wk{border-left:3px solid var(--acc);padding:8px 10px;margin:8px 0;background:#0d1a10;border-radius:0 8px 8px 0}
.wk b{font-size:14px}.wk .mut{font-size:11px}
.warnbox{background:#2a1a0d;border:1px solid #a86b1c;border-radius:10px;padding:10px;margin:8px 0;font-size:13px}
</style>
</head>
<body>
<header><h1>⚽ FM26 <span>Mobile Coach</span></h1><p>Taktik • Wonderkid • Transfer • Latihan — by Jewel</p></header>
<div id="app"></div>
<nav id="nav"></nav>
<script>

const WK=[

const TACTICS=[

/* ---- Taktik Advisor ---- */
let diff=3, ha="home";
function renderTak(){
 let h=`<div class="card"><h2>🎯 Match Advisor</h2><p class="mut">Pilih tingkat kesulitan lawan (1=gampang, 5=susah mati) — terinspirasi taktik komunitas FMM Vibe.</p>
 <h3>Kesulitan lawan</h3><div class="chips">${[1,2,3,4,5].map(d=>`<div class="chip ${d===diff?"on":""} " onclick="diff=${d};render()"><b>${d}</b><small>${["","Gampang","Lumayan","Seimbang","Berat","Susah"][d]}</small></div>`).join("")}</div>
 <h3>Kandang / Tandang</h3><div class="chips">${["home","away"].map(x=>`<div class="chip ${x===ha?"on":""} " onclick="ha='${x}';render()">${x==="home"?"🏠 Kandang":"✈️ Tandang"}</div>`).join("")}</div></div>`;
 const adv=advise();
 h+=`<div class="result"><h3>📋 Rekomendasi (nama persis in-game)</h3><p>🧠 Mentalitas: <span class="big">${adv.ment}</span></p><p>⏩ Tempo Operan: <b>${adv.tempo}</b> &nbsp; ↔️ Lebar: <b>${adv.lebar}</b> &nbsp; 🎨 Kreasi: <b>${adv.kre}</b></p><ul>${adv.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
 h+=`<div class="card"><h2>📖 7 Mentalitas In-Game (dari screenshot)</h2><p class="mut">Urutan dari paling bertahan → paling menyerang:</p><ul><li><b>Berisi</b> — paling bertahan (underdog ekstrem)</li><li><b>Bertahan</b> — fokus bertahan, serang balik</li><li><b>Seimbang</b> — tengah-tengah</li><li><b>Kontrol</b> — kuasai bola + hati-hati</li><li><b>Serangan</b> — gempur</li><li><b>Menyerang</b> — gempur habis-habisan</li><li><b>Overload</b> — darurat saat ketinggalan</li></ul></div>`;
 h+=`<div class="card"><h2>📐 Taktik Plug & Play</h2><p class="mut">Preset komunitas, tinggal tiru settingnya.</p>${TACTICS.map((t,i)=>`<div class="wk"><b>${t.name}</b> <span class="tag t-pos">${t.form}</span><br><span class="mut">Mentalitas: ${t.ment} • Tempo: ${t.tempo} • Lebar: ${t.lebar} • Kreasi: ${t.kre}</span><p style="margin-top:6px">${t.desc}</p><ul>${t.tips.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
 h+=`<div class="card"><h2>⚙️ Setting Pelatih (Coaches)</h2><ul><li><b>1 Stamina</b> — jadikan asisten manajer</li><li><b>2 Attacking</b></li><li><b>1 Defending</b></li><li>Lo sendiri ambil peran <b>Stamina coach</b></li></ul><p class="mut">Formula komunitas FMM Vibe yang terbukti stabil.</p></div>`;
 h+=`<div class="card"><h2>🔄 Aturan Pergantian</h2><ul><li>Unggul <b>3 gol</b> vs tim lemah → ganti ke <b>Counter + Slow</b></li><li>Unggul <b>2 gol</b> vs tim kuat → ganti ke <b>Counter + Slow</b></li><li>Kebobolan 2 gol cepat → turunkan 1 level mentality, jangan panik ganti formasi</li></ul></div>`;
 return h;
}
function advise(){
 let m,t,l,k,tips=[];
 if(diff===1){m="Menyerang";t="Cepat";l="Lebar";k="Ekspresif";tips.push("Lawan jauh di bawah — gas penuh dari menit awal.");}
 else if(diff===2){m="Serangan";t="Cepat";l="Lebar";k="Ekspresif";tips.push("Dominasi, kunci lawan di areanya.");}
 else if(diff===3){m="Kontrol";t="Normal";l="Seimbang";k="Seimbang";tips.push("Kuasai bola tapi tetap hati-hati di belakang.");}
 else if(diff===4){m="Seimbang";t="Normal";l="Seimbang";k="Seimbang";tips.push("Jangan terlalu terbuka — amankan dulu.");}
 else{m="Bertahan";t="Lambat";l="Sempit";k="Disiplin";tips.push("Underdog: rapat, disiplin, serang balik.");}
 if(ha==="away"&&diff>=4){tips.push("Tandang vs lawan jauh lebih kuat: pertimbangkan <b>Berisi</b>.");}
 if(ha==="home"&&diff<=2){tips.push("Kandang vs tim lemah: target menang besar.");}
 tips.push("Ketinggalan di 15 menit akhir → <b>Overload</b> (mode darurat).");
 tips.push("Unggul 2-3 gol → turunkan 1-2 level mentalitas + Tempo Lambat.");
 return{ment:m,tempo:t,lebar:l,kre:k,tips};
}
/* ---- Wonderkids ---- */
let wpos="ALL",wqtier="ALL",wq="";
function renderWk(){
 const pos=["ALL","GK","DEF","MID","ATT"];
 let h=`<div class="card"><h2>⭐ Database Wonderkid</h2><p class="mut">${WK.length} pemain dari riset komunitas (harga estimasi, bisa beda di save lo).</p>
 <input type="text" id="wq" placeholder="🔍 Cari nama..." value="${wq}" oninput="wq=this.value;renderWk2()">
 <h3>Posisi</h3><div class="chips">${pos.map(p=>`<div class="chip ${p===wpos?"on":""}" onclick="wpos='${p}';render()">${p==="ALL"?"Semua":p}</div>`).join("")}</div>
 <h3>Tier Harga</h3><div class="chips">${["ALL","Marquee","Mid","Budget"].map(t=>`<div class="chip ${t===wqtier?"on":""}" onclick="wqtier='${t}';render()">${t==="ALL"?"Semua":t}</div>`).join("")}</div></div><div id="wklist"></div>`;
 return h;
}
function renderWk2(){
 const list=WK.filter(w=>(wpos==="ALL"||w.p===wpos)&&(wqtier==="ALL"||w.tier===wqtier)&&w.n.toLowerCase().includes(wq.toLowerCase()));
 document.getElementById("wklist").innerHTML=list.length?list.map(w=>`<div class="wk"><b>${w.n}</b> <span class="tag t-pos">${w.pos}</span><span class="tag t-${w.tier}">${w.tier}</span><br><span class="mut">Harga: ${w.price} • Kunci: ${w.key}</span><p style="margin-top:4px">${w.note}</p></div>`).join(""):`<div class="card"><p class="mut">Tidak ketemu. Coba kata kunci lain.</p></div>`;
 const inp=document.getElementById("wq");inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
}
/* ---- Transfer ---- */
function renderTr(){return `<div class="card"><h2>🛒 Panduan Transfer</h2>
<h3>🔍 Cara Cari Pemain (In-Game)</h3><ul><li>Buka <b>pencarian pemain</b> → filter <b>posisi, umur, dan value</b> sesuai kebutuhan</li><li>Untuk wonderkid: filter umur <b>15–21</b>, prioritaskan yang statusnya mau dipinjamkan/dilepas</li><li><b>Scout report</b> (fitur FM26 Mobile) — baca sebelum beli: cek atribut kunci, bukan cuma rating bintang</li><li>Klik peran di skuad → game menyorot <b>atribut penting</b> untuk peran itu. Pakai itu sebagai patokan</li><li>Pemain kontrak &lt;1 tahun = potensi bargain</li></ul>

/* ---- Latihan ---- */

<h3>✅ Yang Bikin Wonderkid Melejit</h3><ul><li><b>Menit main reguler</b> — faktor #1. Rotasi di cup + liga vs tim lemah</li><li><b>Pinjaman tepat</b> — klub yang menjanjikan menit main, bukan cuma nama besar</li><li><b>Tailored training</b> (fitur baru FM26 Mobile) — boost performa pemain kunci jelang matchday</li><li><b>Mentoring</b> — sandingkan dengan senior berpersonality bagus</li></ul>

/* ---- Karier ---- */
function renderKar(){return `<div class="card"><h2>💼 Mode Pengangguran → Legenda</h2><p class="mut">Panduan karier dari nol: tanpa klub, tanpa reputasi, sampai jadi manajer top.</p></div>
<div class="card"><h2>🔍 Cara Dapat Kerja Pertama</h2><ul><li>Lamar ke klub yang <b>manajernya di ujung tanduk</b> (cek job security rendah di berita)</li><li><b>Pertengahan musim</b> paling gampang — klub panik cari pengganti</li><li>Klub <b>zona degradasi / papan bawah</b> hampir selalu terima lamaran</li><li>Jangan pilih-pilih di awal — terima yang ada, reputasi dibangun dari hasil</li><li>Naikkan <b>ekspektasi gaji rendah</b> biar dilirik klub kecil</li></ul></div>
<div class="card"><h2>📊 Sistem Reputasi</h2><ul><li><b>Naik</b> kalau finish <b>di atas ekspektasi board</b> (misal target papan tengah, lo bawa playoff)</li><li><b>Turun/stagnan</b> kalau cuma pas ekspektasi atau dipecat</li><li>Trofi kecil (cup lokal) = boost reputasi lumayan</li><li>Reputasi tinggi → klub besar mau wawancara lo</li></ul></div>
<div class="card"><h2>💰 Survival Klub Kecil</h2><ul><li><b>Free agent</b> adalah sahabat — cek tiap awal musim</li><li><b>Pinjaman</b> dari klub besar untuk isi skuad (lihat tab 🛒)</li><li>Wonderkid tier <b>Budget</b> di tab ⭐ — murah, mau gabung klub kecil</li><li>Jual pemain bintang yang tidak krusial → dananya buat 3-4 pemain bagus</li><li>Gaji: jangan jebol struktur gaji demi satu pemain</li></ul></div>
<div class="card"><h2>🗺️ Roadmap Karier</h2><ul><li><b>Musim 1-2:</b> klub kecil — target: selamatkan dari degradasi / promosi = reputasi naik</li><li><b>Musim 3-4:</b> klub menengah — target: Eropa / trofi domestik</li><li><b>Musim 5+:</b> klub top — target: gelar liga & Champions</li><li>Pindah <b>di akhir musim</b> setelah prestasi — nilai jual lo tertinggi</li></ul></div>
<div class="warnbox">⚠️ <b>Jangan sampai dipecat!</b> Selalu cek ekspektasi board tiap awal musim. Kalau target "bertahan di liga", jangan ngoyo janji juara — penuhi minimal dulu, bonus kalau overachieve.</div>`}
/* ---- render ---- */
function render(){
 const a=document.getElementById("app");
 a.innerHTML=cur==="tak"?renderTak():cur==="wk"?renderWk():cur==="tr"?renderTr():cur==="kar"?renderKar():renderLat();
 if(cur==="wk")renderWk2();
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===cur));
 window.scrollTo(0,0);
}
async function init(){
 const n=document.getElementById("nav");
 n.innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]==="tak"?"on":""}"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("");
 n.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.t;render()});
 render();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
init();
</script>
</body>
</html>
